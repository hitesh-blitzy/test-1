<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Blitzy — Integrations (redesign prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css"/>
<style>
:root{
--brand:#5b39f3;--brand-hover:#4f30d6;--brand-soft:#d4cbfc;--brand-tint:#f3f0ff;
--ink:#000;--sec:#666;--ter:#999;--border:#d9d9d9;--neutral50:#f5f5f5;
--succ-bg:#c9fcea;--succ-tx:#005335;--err-bg:#ffdfdf;--err-tx:#991010;
--r:12px;--r-sm:8px;--shadow:0 15px 33px rgba(130,130,130,.10),0 2px 6px rgba(0,0,0,.05);
font-family:"Inter",system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--neutral50);color:var(--ink);letter-spacing:-0.1px;}
.demo{background:#1c1c22;color:#cfcad6;padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12px;}
.demo b{color:#fff;font-weight:600;margin-right:4px;}.demo .grp{display:flex;gap:6px;align-items:center;}
.demo button{font:500 12px Inter;padding:5px 11px;border-radius:7px;border:1px solid #3a3a44;background:#26262e;color:#cfcad6;cursor:pointer;}
.demo button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.demo .log{margin-left:auto;color:#8a8594;font-style:italic;}
.app{max-width:1180px;margin:0 auto;padding:28px 28px 60px;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;}
.logo-t{font-weight:600;font-size:18px;}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;}
.tab{font-size:14px;font-weight:500;color:var(--sec);padding:10px 0;}
.tab.active{color:var(--ink);font-weight:600;border-bottom:2px solid var(--brand);margin-bottom:-1px;}
.layout{display:grid;grid-template-columns:200px 1fr;gap:28px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.navitem{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--sec);padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;}
.navitem:hover{background:#ececec;}.navitem.active{background:var(--brand-tint);color:var(--brand);font-weight:600;}
.navitem .ti{font-size:18px;}
.navhint{font-size:11px;color:var(--ter);padding:14px 12px 6px;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.canvas{min-height:300px;}
.cat-empty{background:#fff;border:1px dashed var(--border);border-radius:var(--r);padding:40px;text-align:center;color:var(--ter);}
.company{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.company-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--neutral50);}
.brandmark{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--neutral50);}
.brandmark.az{background:#0078d4;color:#fff;font-size:13px;font-weight:600;}
.company-name{font-size:18px;font-weight:600;}.company-sub{font-size:13px;color:var(--ter);margin-top:1px;}
.rollup{margin-left:auto;font-size:12px;font-weight:500;color:var(--sec);display:flex;align-items:center;gap:6px;}
.rollup .dot{width:8px;height:8px;border-radius:50%;background:var(--ter);}
.rollup .dot.g{background:#10b07a;}.rollup .dot.r{background:#e24b4a;}
.subs{padding:8px 12px 12px;}
.sub{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:var(--r-sm);}
.sub + .sub{border-top:1px solid var(--neutral50);}
.vmark{width:26px;height:26px;border-radius:6px;background:var(--neutral50);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sec);flex:0 0 auto;}
.vinfo{min-width:0;}.vname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.vdesc{font-size:12.5px;color:var(--ter);margin-top:1px;}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.badge.ok{background:var(--succ-bg);color:var(--succ-tx);}.badge.err{background:var(--err-bg);color:var(--err-tx);}
.badge.run{background:var(--brand-tint);color:var(--brand);}.badge.soon{background:var(--neutral50);color:var(--ter);}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.btn{font:600 14px Inter;padding:9px 18px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--brand);color:#fff;}.btn.primary:hover{background:var(--brand-hover);}
.btn.outline{background:#fff;color:var(--brand);border-color:var(--brand-soft);}.btn.outline:hover{background:var(--brand-tint);}
.btn.ghost{background:transparent;color:var(--sec);border-color:var(--border);}
.btn.danger{background:var(--err-tx);color:#fff;}.btn:disabled{opacity:.45;cursor:not-allowed;}
.kebab{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--sec);font-size:18px;display:flex;align-items:center;justify-content:center;}
.kebab:hover{background:var(--neutral50);}
.spin{width:15px;height:15px;border:2px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
.readonly{font-size:12px;color:var(--ter);font-style:italic;}
.menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:40;}
.menu div{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:9px 10px;border-radius:6px;cursor:pointer;}
.menu div:hover{background:var(--neutral50);}.menu div.danger{color:var(--err-tx);}
.menu .sep{height:1px;background:var(--neutral50);margin:4px 2px;padding:0;}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;}
.scrim.show{display:flex;}
.dialog{background:#fff;border-radius:var(--r);width:520px;max-width:94vw;padding:24px;box-shadow:var(--shadow);max-height:88vh;overflow:auto;}
.dialog h3{margin:0;font-size:18px;font-weight:600;}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.dh .ti{font-size:22px;}
.dlede{font-size:13.5px;color:var(--sec);margin:0 0 16px;line-height:1.5;}
.tophelp{background:var(--brand-tint);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;margin-bottom:18px;}
.tophelp a{color:var(--brand);font-weight:600;text-decoration:none;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.fld input{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 12px;font:400 14px Inter;}
.fld input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);}
.fld .help{font-size:12px;color:var(--ter);margin-top:5px;}
.drow{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
/* share modal */
.share{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;min-height:240px;}
.share .fl{width:42%;border-right:1px solid var(--border);padding:8px;background:var(--neutral50);}
.share .fr{width:58%;padding:14px;}
.frow{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px;border-radius:6px;cursor:pointer;}
.frow:hover{background:#fff;}.frow.sel{background:#fff;font-weight:600;color:var(--brand);}
.frow .c{margin-left:auto;font-size:11px;color:var(--ter);font-weight:500;}
.acc{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;}
.acc .rm{color:var(--brand);cursor:pointer;font-size:12px;}
.lbl{font-size:11px;color:var(--ter);margin:12px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.share input.q{width:100%;height:34px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font:400 13px Inter;margin-bottom:6px;}
.res{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer;}
.res:hover{background:var(--neutral50);}
</style>
</head>
<body>
<div class="demo">
  <span class="grp"><b>State</b>
    <button data-scn="zero">Zero</button>
    <button data-scn="mixed" class="on">Connected (mixed)</button>
    <button data-scn="ideal">Ideal (all)</button></span>
  <span class="grp"><b>Role</b>
    <button data-role="admin" class="on">Super Admin</button>
    <button data-role="member">Team Member</button></span>
  <span class="log" id="log">Ready</span>
</div>
<div class="app">
  <div class="topbar"><div class="logo">B</div><div class="logo-t">Blitzy</div></div>
  <div class="tabs">
    <div class="tab">Plan &amp; Usage</div><div class="tab">Team</div>
    <div class="tab active">Integrations</div><div class="tab">Environments</div>
    <div class="tab">Rules</div><div class="tab">Artifacts</div>
    <div class="tab">Notifications</div><div class="tab">Profile</div><div class="tab">Password</div>
  </div>
  <div class="layout">
    <div class="nav">
      <div class="navhint">Categories</div>
      <div class="navitem active" data-cat="scm"><i class="ti ti-code"></i>SCM</div>
      <div class="navitem" data-cat="design"><i class="ti ti-palette"></i>Design</div>
      <div class="navhint">More to come</div>
    </div>
    <div class="canvas" id="canvas"></div>
  </div>
</div>
<div class="scrim" id="scrim"><div class="dialog" id="dialog"></div></div>
<script>
var FORMS={
 github:{title:'GitHub Enterprise Server connection',mark:'ti-brand-github',top:'First, register an OAuth app in GitHub Enterprise',learn:true,
   fields:[{l:'Server URL',ph:'https://github.yourcompany.com',h:"Your organization's GitHub Enterprise Server",req:true},
           {l:'Client ID',ph:'',h:'Developer settings, then OAuth Apps',req:true},
           {l:'Client secret',ph:'',h:'Shown once when registering the app',req:true}]},
 gitlab:{title:'GitLab Self-Managed connection',mark:'ti-brand-gitlab',top:'First, create an application in GitLab',learn:true,
   fields:[{l:'GitLab URL',ph:'https://gitlab.yourcompany.com',h:"Your organization's GitLab instance",req:true},
           {l:'Application ID',ph:'',h:'Preferences, then Applications',req:true},
           {l:'Secret',ph:'',h:'Shown once when creating the application',req:true}]},
 bitbucket:{title:'Bitbucket Data Center connection',mark:'ti-brand-bitbucket',top:'First, create an application in Bitbucket',learn:true,
   fields:[{l:'Bitbucket URL',ph:'https://bitbucket.yourcompany.com',h:"Your organization's Bitbucket instance",req:true},
           {l:'Application ID',ph:'',h:'Administration, then Application Links',req:true},
           {l:'Secret',ph:'',h:'Shown once when creating the application',req:true}]}
};
var DATA={
 scm:[
  {key:'github',name:'GitHub',mark:'ti-brand-github',subs:[
    {id:'gh',name:'GitHub',desc:'Cloud, github.com',connect:{kind:'oauth',provider:'GitHub'}},
    {id:'ghe',name:'GitHub Enterprise Server',desc:'Self-hosted server',connect:{kind:'form',form:'github'}}]},
  {key:'gitlab',name:'GitLab',mark:'ti-brand-gitlab',subs:[
    {id:'gl',name:'GitLab',desc:'Cloud, gitlab.com',connect:{kind:'oauth',provider:'GitLab'}},
    {id:'gls',name:'GitLab Self-Managed',desc:'Self-managed server',connect:{kind:'form',form:'gitlab'}}]},
  {key:'azure',name:'Azure DevOps',mark:'az',subs:[
    {id:'ado',name:'Azure DevOps',desc:'dev.azure.com',connect:{kind:'oauth',provider:'Azure DevOps'}}]},
  {key:'bitbucket',name:'Bitbucket',mark:'ti-brand-bitbucket',subs:[
    {id:'bb',name:'Bitbucket Data Center',desc:'Self-hosted server',connect:{kind:'form',form:'bitbucket'}}]}
 ],
 design:[{key:'figma',name:'Figma',mark:'ti-brand-figma',subs:[{id:'fig',name:'Figma',desc:'Share frames as design input',soon:true}]}]
};
var PRESETS={zero:{},mixed:{gh:'connected',ghe:'failed',ado:'connected'},ideal:{gh:'connected',ghe:'connected',gl:'connected',gls:'connected',ado:'connected',bb:'connected'}};
var TEAMS=['Galatea UI','Infra','QA Automation','Back-end','Frontend Guild','Security','Payments'];
var cstate={},cat='scm',role='admin',grants={};
function st(id){return cstate[id]||'none';}
function setScenario(s){cstate=Object.assign({},PRESETS[s]);render();log('Loaded "'+s+'" state');}
function log(t){document.getElementById('log').textContent=t;}
function find(id){var r=null;['scm','design'].forEach(function(c){DATA[c].forEach(function(p){p.subs.forEach(function(x){if(x.id===id)r=x;});});});return r;}
function q(s){return Array.prototype.slice.call(document.querySelectorAll(s));}

function rollup(p){var c=0,f=0,t=0;p.subs.forEach(function(s){if(s.soon)return;t++;if(st(s.id)==='connected')c++;if(st(s.id)==='failed')f++;});
 if(f)return '<span class="rollup"><span class="dot r"></span>'+f+' needs attention</span>';
 if(c===t&&t>0)return '<span class="rollup"><span class="dot g"></span>All connected</span>';
 if(c>0)return '<span class="rollup"><span class="dot g"></span>'+c+' of '+t+' connected</span>';
 return '<span class="rollup"><span class="dot"></span>Not connected</span>';}
function badge(s){if(s==='connected')return '<span class="badge ok"><i class="ti ti-circle-check"></i>Connected</span>';
 if(s==='failed')return '<span class="badge err"><i class="ti ti-alert-circle"></i>Connection failed</span>';
 if(s==='connecting')return '<span class="badge run"><span class="spin"></span>Connecting</span>';return '';}
function actions(sub){var s=st(sub.id);
 if(sub.soon)return '<div class="actions"><span class="badge soon">Coming soon</span></div>';
 if(role==='member'){if(s==='connected')return '<div class="actions"><span class="badge ok"><i class="ti ti-circle-check"></i>Connected</span></div>';
   return '<div class="actions"><span class="readonly">'+(s==='failed'?'Unavailable':'Not connected')+'</span></div>';}
 if(s==='connecting')return '<div class="actions"><span class="badge run"><span class="spin"></span>Connecting</span></div>';
 if(s==='connected')return '<div class="actions"><button class="btn outline" data-manage="'+sub.id+'">Manage</button><button class="kebab" data-kebab="'+sub.id+'"><i class="ti ti-dots"></i></button></div>';
 if(s==='failed')return '<div class="actions"><button class="btn primary" data-connect="'+sub.id+'"><i class="ti ti-refresh"></i>Reconnect</button><button class="kebab" data-kebab="'+sub.id+'"><i class="ti ti-dots"></i></button></div>';
 return '<div class="actions"><button class="btn primary" data-connect="'+sub.id+'">Connect</button></div>';}
function render(){var provs=DATA[cat],h='';
 if(!provs||!provs.length){document.getElementById('canvas').innerHTML='<div class="cat-empty">No integrations in this category yet.</div>';return;}
 provs.forEach(function(p){h+='<div class="company"><div class="company-h">';
  h+=p.mark==='az'?'<div class="brandmark az">AZ</div>':'<div class="brandmark"><i class="ti '+p.mark+'"></i></div>';
  h+='<div><div class="company-name">'+p.name+'</div>'+(p.subs.length>1?'<div class="company-sub">'+p.subs.length+' connection types</div>':'')+'</div>'+'</div><div class="subs">';
  p.subs.forEach(function(sub){var s=st(sub.id);
   h+='<div class="sub"><div class="vmark"><i class="ti '+(p.mark==='az'?'ti-brand-azure':p.mark)+'"></i></div>'+
      '<div class="vinfo"><div class="vname">'+sub.name+' '+(s!=='none'&&!sub.soon?badge(s):'')+'</div><div class="vdesc">'+sub.desc+'</div></div>'+actions(sub)+'</div>';});
  h+='</div></div>';});
 document.getElementById('canvas').innerHTML=h;wire();}
function wire(){
 q('[data-connect]').forEach(function(b){b.onclick=function(){startConnect(this.getAttribute('data-connect'));};});
 q('[data-manage]').forEach(function(b){b.onclick=function(){log('Open manage for '+find(this.getAttribute('data-manage')).name);};});
 q('[data-kebab]').forEach(function(b){b.onclick=function(e){e.stopPropagation();openMenu(this.getAttribute('data-kebab'),this);};});}

/* ---- connect journey, per integration ---- */
function startConnect(id){var sub=find(id),c=sub.connect;
 if(c.kind==='oauth')oauthModal(sub);else formModal(sub);}
function oauthModal(sub){var d=document.getElementById('dialog');
 d.innerHTML='<div class="dh"><i class="ti ti-'+(sub.connect.provider==='Azure DevOps'?'brand-azure':'brand-'+(sub.connect.provider==='GitHub'?'github':'gitlab'))+'"></i><h3>Connect '+sub.name+'</h3></div>'+
  '<p class="dlede">You will be redirected to '+sub.connect.provider+' to authorize Blitzy. After you approve, you will return here and the connection will be active.</p>'+
  '<div class="drow"><button class="btn ghost" id="dno">Cancel</button><button class="btn primary" id="dyes"><i class="ti ti-external-link"></i>Authorize on '+sub.connect.provider+'</button></div>';
 show();document.getElementById('dno').onclick=closeD;
 document.getElementById('dyes').onclick=function(){closeD();doConnect(sub.id);};}
function formModal(sub){var f=FORMS[sub.connect.form],vals={};var d=document.getElementById('dialog');
 function valid(){return f.fields.filter(function(x){return x.req;}).every(function(x){return (vals[x.l]||'').trim();});}
 function paint(){
  d.innerHTML='<div class="dh"><i class="ti '+f.mark+'"></i><h3>'+f.title+'</h3></div>'+
   (f.top?'<div class="tophelp">'+f.top+(f.learn?' &nbsp;<a href="#" onclick="return false">Learn how &#8599;</a>':'')+'</div>':'')+
   f.fields.map(function(x,i){return '<div class="fld"><label>'+x.l+'</label><input data-i="'+i+'" placeholder="'+x.ph+'" value="'+(vals[x.l]||'').replace(/"/g,'&quot;')+'"/><div class="help">'+x.h+'</div></div>';}).join('')+
   '<div class="drow"><button class="btn ghost" id="dno">Cancel</button><button class="btn primary" id="dyes"'+(valid()?'':' disabled')+'>Connect</button></div>';
  d.querySelectorAll('input[data-i]').forEach(function(inp){inp.oninput=function(){vals[f.fields[this.getAttribute('data-i')].l]=this.value;var y=document.getElementById('dyes');y.disabled=!valid();};});
  document.getElementById('dno').onclick=closeD;
  document.getElementById('dyes').onclick=function(){if(!valid())return;closeD();doConnect(sub.id);};
 }
 paint();show();}
function doConnect(id){cstate[id]='connecting';render();var nm=find(id).name;log('Connecting '+nm+'…');
 setTimeout(function(){cstate[id]='connected';render();log(nm+' connected');},1100);}

/* ---- 3-dot menu ---- */
var openKebab=null;
function openMenu(id,anchor){closeMenu();var sub=find(id);var m=document.createElement('div');m.className='menu';openKebab=m;
 m.innerHTML='<div data-m="refresh"><i class="ti ti-refresh"></i>Refresh connection</div>'+
  '<div data-m="share"><i class="ti ti-users"></i>Share folder access</div>'+
  '<div class="sep"></div>'+
  '<div class="danger" data-m="disconnect"><i class="ti ti-unlink"></i>Disconnect</div>'+
  '<div class="danger" data-m="revoke"><i class="ti ti-shield-x"></i>Revoke access</div>';
 document.body.appendChild(m);var r=anchor.getBoundingClientRect();
 m.style.top=(window.scrollY+r.bottom+6)+'px';m.style.left=(window.scrollX+r.right-m.offsetWidth)+'px';
 m.querySelectorAll('[data-m]').forEach(function(it){it.onclick=function(){var a=this.getAttribute('data-m');closeMenu();onMenu(a,sub);};});}
function closeMenu(){if(openKebab){openKebab.remove();openKebab=null;}}
document.addEventListener('click',closeMenu);
function onMenu(a,sub){
 if(a==='refresh'){cstate[sub.id]='connecting';render();log('Refreshing '+sub.name+'…');setTimeout(function(){cstate[sub.id]='connected';render();log(sub.name+' refreshed');},800);return;}
 if(a==='share'){shareModal(sub);return;}
 if(a==='disconnect')confirmD('Disconnect '+sub.name+'?',
   'Blitzy will stop using this connection. Folder access granted to teams from it, and any project using it, will break. The app stays installed on the server, so you can reconnect later without re-approving.',
   'Disconnect',function(){cstate[sub.id]='none';render();log(sub.name+' disconnected');});
 if(a==='revoke')confirmD('Revoke access to '+sub.name+'?',
   'This removes Blitzy from the server entirely and revokes its permissions at the source. All folder grants and connected projects break. To use it again you must reinstall and re-approve from scratch.',
   'Revoke access',function(){cstate[sub.id]='none';render();log(sub.name+' access revoked');});}

/* ---- folder sharing (top-level folders, push, inheritance) ---- */
function shareModal(sub){var folders=[{id:'platform',n:'platform'},{id:'design',n:'design'}];
 var key=sub.id;grants[key]=grants[key]||{platform:['Frontend Guild'],design:[]};var sel='platform',qy='';
 var d=document.getElementById('dialog');
 function paint(){
  var g=grants[key];
  var fl=folders.map(function(f){return '<div class="frow '+(f.id===sel?'sel':'')+'" data-f="'+f.id+'"><i class="ti ti-folder"></i>'+f.n+'<span class="c">'+(g[f.id]||[]).length+'</span></div>';}).join('');
  var cur=g[sel]||[];
  var accHtml=cur.length?cur.map(function(t){return '<div class="acc"><span><i class="ti ti-users" style="margin-right:6px;color:var(--sec)"></i>'+t+'</span><span class="rm" data-rm="'+t+'">Remove</span></div>';}).join(''):'<div style="font-size:13px;color:var(--ter)">No teams yet.</div>';
  var avail=TEAMS.filter(function(t){return cur.indexOf(t)<0&&t.toLowerCase().indexOf(qy.toLowerCase())>=0;});
  var resHtml=avail.length?avail.map(function(t){return '<div class="res" data-add="'+t+'"><span><i class="ti ti-users" style="margin-right:6px;color:var(--sec)"></i>'+t+'</span><i class="ti ti-plus" style="color:var(--brand)"></i></div>';}).join(''):'<div style="font-size:12px;color:var(--ter);padding:6px 8px">No teams found.</div>';
  d.innerHTML='<div class="dh"><i class="ti '+(sub.connect&&sub.connect.form?FORMS[sub.connect.form].mark:'ti-brand-github')+'"></i><h3>'+sub.name+' — folder access</h3></div>'+
   '<p class="dlede">Grant a team access to a top-level folder. Everything inside inherits it. This connection has its own access, separate from other connections.</p>'+
   '<div class="share"><div class="fl">'+fl+'</div><div class="fr"><div class="lbl">Teams with access to '+sel+'</div>'+accHtml+
   '<div class="lbl">Add a team</div><input class="q" id="q" placeholder="Search teams" value="'+qy.replace(/"/g,'&quot;')+'"/><div id="res">'+resHtml+'</div></div></div>'+
   '<div class="drow"><button class="btn primary" id="dno">Done</button></div>';
  d.querySelectorAll('[data-f]').forEach(function(e){e.onclick=function(){sel=this.getAttribute('data-f');qy='';paint();};});
  d.querySelectorAll('[data-rm]').forEach(function(e){e.onclick=function(){var t=this.getAttribute('data-rm');g[sel]=g[sel].filter(function(z){return z!==t;});paint();};});
  d.querySelectorAll('[data-add]').forEach(function(e){e.onclick=function(){var t=this.getAttribute('data-add');(g[sel]=g[sel]||[]).push(t);qy='';paint();};});
  var qi=document.getElementById('q');if(qi)qi.oninput=function(){qy=this.value;paint();var n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(qy.length,qy.length);}};
  document.getElementById('dno').onclick=function(){closeD();log('Updated folder access for '+sub.name);};
 }
 paint();show();}

function confirmD(t,b,a,yes){var d=document.getElementById('dialog');
 d.innerHTML='<h3>'+t+'</h3><p class="dlede" style="margin-top:8px">'+b+'</p><div class="drow"><button class="btn ghost" id="dno">Cancel</button><button class="btn danger" id="dyes">'+a+'</button></div>';
 show();document.getElementById('dno').onclick=closeD;document.getElementById('dyes').onclick=function(){closeD();yes();};}
function show(){document.getElementById('scrim').classList.add('show');}
function closeD(){document.getElementById('scrim').classList.remove('show');}
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeD();});

q('[data-scn]').forEach(function(b){b.onclick=function(){q('[data-scn]').forEach(function(x){x.classList.remove('on');});this.classList.add('on');setScenario(this.getAttribute('data-scn'));};});
q('[data-role]').forEach(function(b){b.onclick=function(){q('[data-role]').forEach(function(x){x.classList.remove('on');});this.classList.add('on');role=this.getAttribute('data-role');render();log('Role: '+(role==='admin'?'Super Admin':'Team Member'));};});
q('[data-cat]').forEach(function(b){b.onclick=function(){q('[data-cat]').forEach(function(x){x.classList.remove('active');});this.classList.add('active');cat=this.getAttribute('data-cat');render();log('Category: '+cat.toUpperCase());};});
setScenario('mixed');
</script>
</body>
</html>
