<!--
  DOWNSTREAM FORWARD-REFERENCES (documentation only — NOT implemented in this prototype).
  This behavioral-and-visual prototype authoritatively specifies the behavior the following
  production targets must satisfy. They are NOT files in this repository and are NOT created here:
    • src/panel/workspace/settings/integrations.tsx  — route /workspace/settings/integrations
    • SvcType enum  — extend with GitHub Enterprise Server + Bitbucket Data Center alongside
                      GITHUB / AZURE_DEVOPS / GITLAB / GITLAB_SELF_HOSTED
    • IntegrationTeamShareRequest + bulkUpdateIntegrationTeamAccess  — folder-aware, anchored on a
                      stable folder/node identifier. Grant tuple {connectionId, folderStableId,
                      folderPathSnapshot, teamId}; inheritance computed at read time; rename/move
                      safe; delete = broken (only error case).
    • GITLAB_SELF_HOSTED adapter  — template for new self-hosted adapters.
    • TreeNode + MAX_GITLAB_DEPTH=20  — reused read-only (no backend tree-fetch changes).
    • Project Source/Destination pickers  — read-side filtering by granted folders.

  DEFENSE IN DEPTH — SERVER-SIDE AUTHORIZATION (REQUIRED, F-007 two-layer enforcement):
    The role gating in this prototype (Super Admin sees connect/manage/share/disconnect/revoke
    controls; Team Member is read-only) is a UI-LAYER convenience ONLY and is NOT a security
    boundary. The downstream production APIs MUST INDEPENDENTLY RE-AUTHORIZE every privileged
    mutation server-side and REJECT any non-administrator caller — regardless of UI gating —
    for ALL of: connect / reconnect, manage, share folder access (IntegrationTeamShareRequest /
    bulkUpdateIntegrationTeamAccess), refresh, disconnect, and revoke access. A hidden or
    disabled control in the client must never be the only thing standing between a non-admin
    and a privileged operation; the server is the authoritative enforcement point (HTTP 403 on
    failed authorization). Folder-grant mutations additionally validate the caller's admin
    scope on the target connection before persisting any {connectionId, folderStableId,
    folderPathSnapshot, teamId} tuple.
-->

<style>
:root{
--brand:#5b39f3;--brand-hover:#4f30d6;--brand-soft:#d4cbfc;--brand-tint:#f3f0ff;
--ink:#000;--sec:#666;--ter:#999;--border:#d9d9d9;--neutral50:#f5f5f5;
--succ-bg:#c9fcea;--succ-tx:#005335;--err-bg:#ffdfdf;--err-tx:#991010;
--r:12px;--r-sm:8px;--shadow:0 15px 33px rgba(130,130,130,.10),0 2px 6px rgba(0,0,0,.05);
font-family:"Inter",system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--neutral50);color:var(--ink);letter-spacing:-0.1px;}
/* DEMO-ONLY: state/role scenario toolbar styles — excluded from the production build. The dark literals in this block are sanctioned prototype-only values. */
.demo{background:#1c1c22;color:#cfcad6;padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12px;}
.demo b{color:#fff;font-weight:600;margin-right:4px;}.demo .grp{display:flex;gap:6px;align-items:center;}
.demo button{font:500 12px Inter;padding:5px 11px;border-radius:7px;border:1px solid #3a3a44;background:#26262e;color:#cfcad6;cursor:pointer;}
.demo button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.demo .log{margin-left:auto;color:#8a8594;font-style:italic;}
.app{max-width:1180px;margin:0 auto;padding:28px 28px 60px;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;}
.logo-t{font-weight:600;font-size:18px;}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;}
.tab{font-size:14px;font-weight:500;color:var(--sec);padding:10px 0;}
.tab.active{color:var(--ink);font-weight:600;border-bottom:2px solid var(--brand);margin-bottom:-1px;}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.navitem{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--sec);padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;background:transparent;border:0;text-align:left;width:100%;font-family:inherit;}
.navitem:hover{background:var(--neutral50);}.navitem.active{background:var(--brand-tint);color:var(--brand);font-weight:600;}
.navitem:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.navitem .ti{font-size:18px;}
.navhint{font-size:11px;color:var(--ter);padding:14px 12px 6px;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.canvas{min-height:300px;}
.cat-empty{background:#fff;border:1px dashed var(--border);border-radius:var(--r);padding:40px;text-align:center;color:var(--ter);}
.company{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.company-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--neutral50);}
.brandmark{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--neutral50);}
.brandmark.az{background:#0078d4;color:#fff;font-size:13px;font-weight:600;}
.company-name{font-size:18px;font-weight:600;}.company-sub{font-size:13px;color:var(--ter);margin-top:1px;}
.subs{padding:8px 12px 12px;}
.sub{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:var(--r-sm);}

.vinfo{min-width:0;}.vname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}

.vdesc{font-size:12.5px;color:var(--ter);margin-top:1px;}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.badge.ok{background:var(--succ-bg);color:var(--succ-tx);}.badge.err{background:var(--err-bg);color:var(--err-tx);}
.badge.run{background:var(--brand-tint);color:var(--brand);}.badge.soon{background:var(--neutral50);color:var(--ter);}
/* min-height equals the settled action button height (.btn renders at 37px: 14px line +
   9px*2 padding + 1px*2 border). It makes the transient "Connecting" treatment (.badge.run,
   ~21px) reserve the SAME vertical space as a settled Connect/Manage/Reconnect button, so the
   sub-card row height stays constant across none/connecting/connected/failed. Without it the
   actions slot shrinks during the connecting phase and the row drops ~2px, causing a layout
   shift at the connecting<->settled boundary (CP4 "no layout shift"). align-items:center keeps
   the badge/readonly label vertically centred within the reserved height. */
.actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto;min-height:37px;}
.btn{font:600 14px Inter;padding:9px 18px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--brand);color:#fff;}.btn.primary:hover{background:var(--brand-hover);}
.btn.outline{background:#fff;color:var(--brand);border-color:var(--brand-soft);}.btn.outline:hover{background:var(--brand-tint);}
.btn.ghost{background:transparent;color:var(--sec);border-color:var(--border);}.btn.ghost:hover{background:var(--neutral50);}
.btn.danger{background:var(--err-tx);color:#fff;}.btn.danger:hover{filter:brightness(.88);}.btn:disabled{opacity:.45;cursor:not-allowed;}
.kebab{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--sec);font-size:18px;display:flex;align-items:center;justify-content:center;}
.kebab:hover{background:var(--neutral50);}
.spin{width:15px;height:15px;border:2px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
/* Respect reduced-motion: stop the spin and leave a static ring indicator. */
@media (prefers-reduced-motion: reduce){.spin{animation:none;}}
.readonly{font-size:12px;color:var(--ter);font-style:italic;}
.menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:40;}
.menu div{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:9px 10px;border-radius:6px;cursor:pointer;}
.menu div:hover{background:var(--neutral50);}.menu div.danger{color:var(--err-tx);}
.menu .sep{height:1px;background:var(--neutral50);margin:4px 2px;padding:0;}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;}
.scrim.show{display:flex;}
.dialog{background:#fff;border-radius:var(--r);width:520px;max-width:94vw;padding:24px;box-shadow:var(--shadow);max-height:88vh;overflow:auto;}
.dialog h3{margin:0;font-size:18px;font-weight:600;}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.dh .ti{font-size:22px;}
.dlede{font-size:13.5px;color:var(--sec);margin:0 0 16px;line-height:1.5;}
.tophelp{background:var(--brand-tint);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;margin-bottom:18px;}
.tophelp a{color:var(--brand);font-weight:600;text-decoration:none;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.fld input{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 12px;font:400 14px Inter;}
.fld input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);}
.fld .help{font-size:12px;color:var(--ter);margin-top:5px;}
.drow{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
/* share modal */
.share{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;min-height:240px;}
.share .fl{width:42%;border-right:1px solid var(--border);padding:8px;background:var(--neutral50);}

.frow{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px;border-radius:6px;cursor:pointer;background:transparent;border:0;text-align:left;width:100%;font-family:inherit;color:inherit;}

.frow .c{margin-left:auto;font-size:11px;color:var(--ter);font-weight:500;}
.acc{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;}
.acc .rm{color:var(--brand);cursor:pointer;font-size:12px;background:transparent;border:0;font-family:inherit;padding:0;}
.lbl{font-size:11px;color:var(--ter);margin:12px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.share input.q{width:100%;height:34px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font:400 13px Inter;margin-bottom:6px;}
.res{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer;background:transparent;border:0;text-align:left;width:100%;font-family:inherit;color:inherit;}
.res:hover{background:var(--neutral50);}
.frow:focus-visible,.res:focus-visible,.acc .rm:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}
/* folder-first sharing: folder hierarchy + direct-vs-inherited rows + redundant-grant notice (E8) */
.frow.child{padding-left:24px;}
.frow .fn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.muted{font-size:13px;color:var(--ter);padding:4px 0;}
.uic{margin-right:6px;color:var(--sec);}
.acc.inh{color:var(--sec);}
.acc.inh .lock{color:var(--ter);font-size:14px;margin-right:6px;vertical-align:-2px;}
.acc.inh .src{color:var(--ter);font-size:12px;margin-left:4px;}
.rgrant{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--err-tx);background:var(--err-bg);border-radius:6px;padding:7px 9px;margin-bottom:8px;}
.addp{color:var(--brand);font-size:15px;flex:0 0 auto;}
/* inline field-level error for a malformed self-hosted URL (C3) */
.ferr{font-size:12px;color:var(--err-tx);margin-top:5px;display:none;}
.fld.invalid .ferr{display:block;}
.fld.invalid .help{display:none;}
.fld.invalid input{border-color:var(--err-tx);}
.fld.invalid input:focus{border-color:var(--err-tx);box-shadow:0 0 0 3px var(--err-bg);}
/* ---- Responsive (CP1-002): the two-pane catalogue must never overflow horizontally ----
   Root cause: a bare `1fr` canvas track keeps a min-content floor (~557px) because the
   sub-card header row (mark + name + badge + button + kebab) refuses to shrink, forcing a
   ~813px minimum layout width. Fixes: (1) `.layout` uses minmax(0,1fr) so the canvas can
   shrink below its content's min-content; (2) at tablet/phone widths the rail stacks above the
   canvas as a single column so the canvas spans full width; (3) on very narrow screens the
   sub-card row may wrap its action cluster onto a second line. Desktop (>=769px) is unchanged. */
@media (max-width:768px){
  .app{padding:24px 18px 48px;}
  .layout{grid-template-columns:minmax(0,1fr);gap:18px;}
  .nav{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px;}
  .navhint{width:100%;padding:8px 4px 2px;}
  .navitem{width:auto;}
}
@media (max-width:480px){
  .sub{flex-wrap:wrap;}
}
</style>

<script>
/* ---- security: HTML/attribute escaping (CWE-79 mitigation) ----
   All dynamic strings interpolated into innerHTML pass through esc(). Today the provider,
   folder, and team values are static, but the AAP models them as production SCM/tree/team
   data, so every interpolation — visible text AND attribute contexts (value, data-f, data-rm,
   data-add) — is escaped at the rendering boundary. esc() covers both text and double-quoted
   attribute contexts (escapes & < > " '). Trusted static markup (e.g. badge() output) is NOT
   passed through esc(); only leaf data values are. Attribute read-back via getAttribute()
   auto-decodes the entities, so escaping is transparent to the add/remove handlers. */
var ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC_MAP[c];});}
var FORMS={
 github:{title:'GitHub Enterprise Server connection',mark:'ti-brand-github',top:'First, create an application in GitHub Enterprise Server',learn:'https://docs.github.com/en/enterprise-server@latest/apps/oauth-apps/building-oauth-apps/creating-an-oauth-app',
   fields:[{l:'GitHub Enterprise Server URL',ph:'https://github.yourcompany.com',h:"Your organization's GitHub Enterprise Server",req:true,url:true},
           {l:'Application ID',ph:'',h:'Developer settings, then OAuth Apps',req:true},
           {l:'Secret',ph:'',h:'Shown once when creating the application',req:true,secret:true}]},
 gitlab:{title:'GitLab Self-Managed connection',mark:'ti-brand-gitlab',top:'First, create an application in GitLab',learn:'https://docs.gitlab.com/integration/oauth_provider/',
   fields:[{l:'GitLab URL',ph:'https://gitlab.yourcompany.com',h:"Your organization's GitLab instance",req:true,url:true},
           {l:'Application ID',ph:'',h:'Preferences, then Applications',req:true},
           {l:'Secret',ph:'',h:'Shown once when creating the application',req:true,secret:true}]},
 bitbucket:{title:'Bitbucket Data Center connection',mark:'ti-brand-bitbucket',top:'First, create an application in Bitbucket',learn:'https://confluence.atlassian.com/bitbucketserver/link-to-other-applications-1018764620.html',
   fields:[{l:'Bitbucket URL',ph:'https://bitbucket.yourcompany.com',h:"Your organization's Bitbucket instance",req:true,url:true},
           {l:'Application ID',ph:'',h:'Administration, then Application Links',req:true},
           {l:'Secret',ph:'',h:'Shown once when creating the application',req:true,secret:true}]}
};
var DATA={
 scm:[
  {key:'github',name:'GitHub',mark:'ti-brand-github',subs:[
    {id:'gh',name:'GitHub',desc:'Cloud, github.com',connect:{kind:'oauth',provider:'GitHub'}},
    {id:'ghe',name:'GitHub Enterprise Server',desc:'Self-hosted server',connect:{kind:'form',form:'github'}}]},
  {key:'gitlab',name:'GitLab',mark:'ti-brand-gitlab',subs:[
    {id:'gl',name:'GitLab',desc:'Cloud, gitlab.com',connect:{kind:'oauth',provider:'GitLab'}},
    {id:'gls',name:'GitLab Self-Managed',desc:'Self-managed server',connect:{kind:'form',form:'gitlab'}}]},
  {key:'azure',name:'Azure DevOps',mark:'az',subs:[
    {id:'ado',name:'Azure DevOps',desc:'dev.azure.com',connect:{kind:'oauth',provider:'Azure DevOps'}}]},
  {key:'bitbucket',name:'Bitbucket',mark:'ti-brand-bitbucket',subs:[
    {id:'bb',name:'Bitbucket Data Center',desc:'Self-hosted server',connect:{kind:'form',form:'bitbucket'}}]}
 ],
 design:[{key:'figma',name:'Figma',mark:'ti-brand-figma',subs:[{id:'fig',name:'Figma',desc:'Share frames as design input',soon:true}]}]
};
var PRESETS={zero:{},mixed:{gh:'connected',ghe:'failed',ado:'connected'},connecting:{gh:'connecting',ghe:'connecting',ado:'connecting'},ideal:{gh:'connected',ghe:'connected',gl:'connected',gls:'connected',ado:'connected',bb:'connected'}};
var TEAMS=['Galatea UI','Infra','QA Automation','Back-end','Frontend Guild','Security','Payments'];
/* Per-provider TOP-LEVEL folder forest (F-009/F-010). Two top-level tiers ONLY, matching the
   secondary prototype's workspace>project model: the WORKSPACE/account-org root (parent:null) and
   the top-level project folders directly inside it (parent:'ws'). BOTH tiers are legitimate grant
   targets — there are deliberately NO deeper descendants (no repo/branch/sub-folder levels; those
   are out of scope). A grant on the workspace inherits DOWN to every project; a grant on a project
   stays on that project. Inheritance is resolved at READ TIME from the grant tuples and is NEVER
   stored as a row. This is what keeps the right-pane direct-vs-inherited display and redundant-grant
   blocking live: selecting a project surfaces grants inherited "from blitzy-ai". */
var FOLDERS={
 github:[{id:'ws',n:'blitzy-ai',parent:null},{id:'platform',n:'platform',parent:'ws'},{id:'design',n:'design-system',parent:'ws'},{id:'infra',n:'infra',parent:'ws'}],
 gitlab:[{id:'ws',n:'blitzy-ai',parent:null},{id:'platform',n:'platform',parent:'ws'},{id:'design',n:'design',parent:'ws'},{id:'data',n:'data-eng',parent:'ws'}],
 azure:[{id:'ws',n:'blitzy-ai',parent:null},{id:'platform',n:'Platform',parent:'ws'},{id:'design',n:'Design',parent:'ws'},{id:'mobile',n:'Mobile',parent:'ws'}],
 bitbucket:[{id:'ws',n:'blitzy-ai',parent:null},{id:'platform',n:'platform',parent:'ws'},{id:'design',n:'design',parent:'ws'},{id:'qa',n:'qa-suite',parent:'ws'}],
 figma:[{id:'ws',n:'blitzy-ai',parent:null},{id:'platform',n:'Product',parent:'ws'},{id:'design',n:'Brand',parent:'ws'}]
};
/* Category metadata for the data-driven rail: label + Tabler icon per DATA category key.
   Adding a category = add a DATA key + a CATS entry (a data change, not a layout change). */
var CATS={scm:{label:'SCM',icon:'ti-code'},design:{label:'Design',icon:'ti-palette'}};
var cstate={},cat='scm',role='admin',grants={};
 /* Per-connection async transition registry. A timeout handle is stored per
    connection id; clearTimeout cancels any superseded timer so a stale callback
    can never overwrite newer state (disconnect/revoke/scenario-load). */
 var timers={};
 function clearTimer(id){if(timers[id]){clearTimeout(timers[id]);delete timers[id];}}
 function clearAllTimers(){Object.keys(timers).forEach(function(id){clearTimeout(timers[id]);});timers={};}
 function scheduleState(id,ms,toState,msg){clearTimer(id);timers[id]=setTimeout(function(){delete timers[id];cstate[id]=toState;render();if(msg)log(msg);},ms);}
function st(id){return cstate[id]||'none';}
function setScenario(s){clearAllTimers();cstate=Object.assign({},PRESETS[s]);render();log('Loaded "'+s+'" state');}
function log(t){document.getElementById('log').textContent=t;}
function find(id){var r=null;Object.keys(DATA).forEach(function(c){DATA[c].forEach(function(p){p.subs.forEach(function(x){if(x.id===id)r=x;});});});return r;}
function findProv(id){var r=null;Object.keys(DATA).forEach(function(c){DATA[c].forEach(function(p){p.subs.forEach(function(x){if(x.id===id)r=p;});});});return r;}
function q(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function badge(s){if(s==='connected')return '<span class="badge ok"><i class="ti ti-circle-check-filled" aria-hidden="true"></i>Connected</span>';
 if(s==='failed')return '<span class="badge err"><i class="ti ti-alert-circle" aria-hidden="true"></i>Connection failed</span>';
 if(s==='connecting')return '<span class="badge run"><span class="spin" aria-hidden="true"></span>Connecting</span>';return '';}
/* Role-based action dispatch (F-007). NOTE: this client-side gating (admins get
   Connect/Manage/Reconnect + kebab; members are read-only status labels) is the UI half of a
   TWO-LAYER model. It is NOT a security boundary — production APIs MUST independently reject
   non-admin callers server-side (see the DEFENSE IN DEPTH note in the file header). */
function actions(sub){var s=st(sub.id);
 if(sub.soon)return '<div class="actions"><span class="badge soon">Coming soon</span></div>';
 if(role==='member'){if(s==='connected')return '<div class="actions"><span class="badge ok"><i class="ti ti-circle-check-filled" aria-hidden="true"></i>Connected</span></div>';
   return '<div class="actions"><span class="readonly">'+(s==='failed'?'Unavailable':'Not connected')+'</span></div>';}
 if(s==='connecting')return '<div class="actions"><span class="badge run"><span class="spin" aria-hidden="true"></span>Connecting</span></div>';
 if(s==='connected')return '<div class="actions"><button class="btn outline" data-manage="'+esc(sub.id)+'">Manage</button><button class="kebab" data-kebab="'+esc(sub.id)+'" aria-label="Connection options" aria-haspopup="menu" aria-expanded="false"><i class="ti ti-dots" aria-hidden="true"></i></button></div>';
 if(s==='failed')return '<div class="actions"><button class="btn primary" data-connect="'+esc(sub.id)+'"><i class="ti ti-refresh" aria-hidden="true"></i>Reconnect</button><button class="kebab" data-kebab="'+esc(sub.id)+'" aria-label="Connection options" aria-haspopup="menu" aria-expanded="false"><i class="ti ti-dots" aria-hidden="true"></i></button></div>';
 return '<div class="actions"><button class="btn primary" data-connect="'+esc(sub.id)+'">Connect</button></div>';}
/* Data-driven category rail: built from Object.keys(DATA) so categories participate
   automatically. Items are semantic <button> elements (keyboard operable, focusable,
   with aria-current) — see findings F-001 + accessibility hardening. */
function renderRail(focusActive){var nav=document.getElementById('nav'),h='<div class="navhint">Categories</div>';
 Object.keys(DATA).forEach(function(k){var meta=CATS[k]||{label:k.toUpperCase(),icon:'ti-folder'};
  h+='<button type="button" class="navitem'+(k===cat?' active':'')+'" data-cat="'+esc(k)+'" aria-current="'+(k===cat?'true':'false')+'"><i class="ti '+esc(meta.icon)+'" aria-hidden="true"></i>'+esc(meta.label)+'</button>';});
 h+='<div class="navhint">More to come</div>';nav.innerHTML=h;
 nav.querySelectorAll('[data-cat]').forEach(function(b){b.onclick=function(){cat=this.getAttribute('data-cat');renderRail(true);render();log('Category: '+cat.toUpperCase());};});
 if(focusActive){var act=nav.querySelector('.navitem.active');if(act)act.focus();}}
function render(){var provs=DATA[cat],h='';
 if(!provs||!provs.length){document.getElementById('canvas').innerHTML='<div class="cat-empty">No integrations in this category yet.</div>';return;}
 provs.forEach(function(p){h+='<div class="company"><div class="company-h">';
  h+=p.mark==='az'?'<div class="brandmark az">AZ</div>':'<div class="brandmark"><i class="ti '+esc(p.mark)+'" aria-hidden="true"></i></div>';
  h+='<div><div class="company-name">'+esc(p.name)+'</div>'+(p.subs.length>1?'<div class="company-sub">'+p.subs.length+' connection types</div>':'')+'</div>'+'</div><div class="subs">';
  p.subs.forEach(function(sub){var s=st(sub.id);
   h+='<div class="sub"><div class="vmark"><i class="ti '+esc(p.mark==='az'?'ti-brand-azure':p.mark)+'" aria-hidden="true"></i></div>'+
      '<div class="vinfo"><div class="vname"><span class="vtext">'+esc(sub.name)+'</span> '+(role!=='member'&&s!=='none'&&s!=='connecting'&&!sub.soon?badge(s):'')+'</div><div class="vdesc">'+esc(sub.desc)+'</div></div>'+actions(sub)+'</div>';});
  h+='</div></div>';});
 document.getElementById('canvas').innerHTML=h;wire();}
function wire(){
 q('[data-connect]').forEach(function(b){b.onclick=function(){startConnect(this.getAttribute('data-connect'));};});
 q('[data-manage]').forEach(function(b){b.onclick=function(){log('Open manage for '+find(this.getAttribute('data-manage')).name);};});
 q('[data-kebab]').forEach(function(b){b.onclick=function(e){e.stopPropagation();openMenu(this.getAttribute('data-kebab'),this);};});}

/* ---- connect journey, per integration ---- */
function startConnect(id){var sub=find(id),c=sub.connect;
 if(c.kind==='oauth')oauthModal(sub);else formModal(sub);}
function oauthModal(sub){var d=document.getElementById('dialog');
 d.innerHTML='<div class="dh"><i class="ti ti-'+(sub.connect.provider==='Azure DevOps'?'brand-azure':'brand-'+(sub.connect.provider==='GitHub'?'github':'gitlab'))+'" aria-hidden="true"></i><h3 id="dlgTitle">Connect '+esc(sub.name)+'</h3></div>'+
  '<p class="dlede">You will be redirected to '+esc(sub.connect.provider)+' to authorize Blitzy. After you approve, you will return here and the connection will be active.</p>'+
  '<div class="drow"><button class="btn ghost" id="dno">Cancel</button><button class="btn primary" id="dyes"><i class="ti ti-external-link" aria-hidden="true"></i>Authorize on '+esc(sub.connect.provider)+'</button></div>';
 show();document.getElementById('dno').onclick=closeD;
 document.getElementById('dyes').onclick=function(){closeD();doConnect(sub.id);};}
/* ---- self-hosted server reachability (edge case, F-006 / Group 3) ----
   A SYNTACTICALLY valid URL can still be UNREACHABLE. This prototype SIMULATES the
   server-reachability probe deterministically — production replaces this with a real
   network/SSO probe at the connect boundary. A host using an RFC 2606 / RFC 6761 reserved
   TLD (.invalid/.test/.example/.localhost), a bare host with no dot, or a host explicitly
   marked "unreachable" models a server the backend cannot contact. On failure the dialog
   stays OPEN and an inline, escaped field error is shown via role="alert"; NO transition
   to connecting/connected occurs (guards against a valid-but-dead endpoint). */
function reachable(v){var h;try{h=new URL((v||'').trim()).hostname.toLowerCase();}catch(e){return false;}
 if(!h||h.indexOf('.')<0)return false;
 if(/\.(invalid|test|example|localhost)$/.test(h))return false;
 if(h.indexOf('unreachable')>=0)return false;
 return true;}
var SYNTAX_URL_ERR='Enter a valid URL that starts with http:// or https://';
var UNREACH_URL_ERR="Couldn't reach this server. Check the URL and that the server is reachable.";
function formModal(sub){var f=FORMS[sub.connect.form],vals={},unreach=null;var d=document.getElementById('dialog');
 function validUrl(v){try{var u=new URL((v||'').trim());return u.protocol==='http:'||u.protocol==='https:';}catch(e){return false;}}
 function badUrl(x){return x.url&&(vals[x.l]||'').trim()&&!validUrl(vals[x.l]);}
 function valid(){return f.fields.every(function(x){var v=(vals[x.l]||'').trim();if(x.req&&!v)return false;if(x.url&&v&&!validUrl(v))return false;return true;});}
 function paint(){
  d.innerHTML='<div class="dh"><i class="ti '+esc(f.mark)+'" aria-hidden="true"></i><h3 id="dlgTitle">'+esc(f.title)+'</h3></div>'+
   (f.top?'<div class="tophelp">'+esc(f.top)+(f.learn?' &nbsp;<a href="'+esc(f.learn)+'" target="_blank" rel="noopener noreferrer">Learn how &#8599;</a>':'')+'</div>':'')+
   f.fields.map(function(x,i){var syntaxBad=badUrl(x),reachBad=(unreach===x.l),bad=syntaxBad||reachBad,fmsg=reachBad?UNREACH_URL_ERR:SYNTAX_URL_ERR;return '<div class="fld'+(bad?' invalid':'')+'"><label for="fld'+i+'">'+esc(x.l)+'</label><input id="fld'+i+'" data-i="'+i+'" type="'+(x.secret?'password':'text')+'" placeholder="'+esc(x.ph)+'" value="'+esc(vals[x.l])+'"'+(x.url?' aria-describedby="ferr'+i+'"':'')+(bad?' aria-invalid="true"':'')+'/><div class="help">'+esc(x.h)+'</div>'+(x.url?'<div class="ferr" id="ferr'+i+'" role="alert">'+esc(fmsg)+'</div>':'')+'</div>';}).join('')+
   '<div class="drow"><button class="btn ghost" id="dno">Cancel</button><button class="btn primary" id="dyes"'+(valid()?'':' disabled')+'>Connect</button></div>';
  d.querySelectorAll('input[data-i]').forEach(function(inp){inp.oninput=function(){var x=f.fields[this.getAttribute('data-i')];vals[x.l]=this.value;if(x.url){if(unreach===x.l)unreach=null;var sb=badUrl(x);this.closest('.fld').classList.toggle('invalid',sb);this.setAttribute('aria-invalid',sb?'true':'false');var fe=this.closest('.fld').querySelector('.ferr');if(fe)fe.textContent=SYNTAX_URL_ERR;}document.getElementById('dyes').disabled=!valid();};});
  document.getElementById('dno').onclick=closeD;
  document.getElementById('dyes').onclick=function(){if(!valid())return;var bf=null;f.fields.forEach(function(x){if(!bf&&x.url&&(vals[x.l]||'').trim()&&!reachable(vals[x.l]))bf=x;});if(bf){unreach=bf.l;paint();var bi=d.querySelector('.fld.invalid input');if(bi)bi.focus();log(find(sub.id).name+': server unreachable — check the URL');return;}closeD();doConnect(sub.id);};
 }
 paint();show();}
function doConnect(id){cstate[id]='connecting';render();var nm=find(id).name;log('Connecting '+nm+'…');
 scheduleState(id,1100,'connected',nm+' connected');}

/* ---- 3-dot menu ---- */
var openKebab=null,menuAnchor=null;
function openMenu(id,anchor){closeMenu();var sub=find(id);var m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.setAttribute('aria-label','Connection options');openKebab=m;menuAnchor=anchor;anchor.setAttribute('aria-expanded','true');
 m.innerHTML='<div role="menuitem" tabindex="0" data-m="refresh"><i class="ti ti-refresh" aria-hidden="true"></i>Refresh connection</div>'+
  '<div role="menuitem" tabindex="0" data-m="share"><i class="ti ti-users" aria-hidden="true"></i>Share folder access</div>'+
  '<div class="sep" role="separator"></div>'+
  '<div class="danger" role="menuitem" tabindex="0" data-m="disconnect"><i class="ti ti-unlink" aria-hidden="true"></i>Disconnect</div>'+
  '<div class="danger" role="menuitem" tabindex="0" data-m="revoke"><i class="ti ti-shield-x" aria-hidden="true"></i>Revoke access</div>';
 document.body.appendChild(m);var r=anchor.getBoundingClientRect();
 m.style.top=(window.scrollY+r.bottom+6)+'px';m.style.left=(window.scrollX+r.right-m.offsetWidth)+'px';
 var items=Array.prototype.slice.call(m.querySelectorAll('[data-m]'));
 items.forEach(function(it,idx){it.onclick=function(){var a=this.getAttribute('data-m');var anc=menuAnchor;closeMenu();onMenu(a,sub,anc);};
  it.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();this.click();}else if(ev.key==='ArrowDown'){ev.preventDefault();(items[idx+1]||items[0]).focus();}else if(ev.key==='ArrowUp'){ev.preventDefault();(items[idx-1]||items[items.length-1]).focus();}};});
 if(items[0])items[0].focus();}
function closeMenu(ret){if(openKebab){openKebab.remove();openKebab=null;}if(menuAnchor){menuAnchor.setAttribute('aria-expanded','false');if(ret===true&&document.body.contains(menuAnchor)&&menuAnchor.focus)menuAnchor.focus();menuAnchor=null;}}
document.addEventListener('click',function(){closeMenu();});
function onMenu(a,sub,anchor){
 if(a==='refresh'){cstate[sub.id]='connecting';render();log('Refreshing '+sub.name+'…');scheduleState(sub.id,800,'connected',sub.name+' refreshed');return;}
 if(a==='share'){shareModal(sub,anchor);return;}
 if(a==='disconnect')confirmD('Disconnect '+sub.name+'?',
   'Blitzy will stop using this connection. Folder access granted to teams from it, and any project using it, will break. The app stays installed on the server, so you can reconnect later without re-approving.',
   'Disconnect',function(){clearTimer(sub.id);cstate[sub.id]='none';render();log(sub.name+' disconnected');},anchor);
 if(a==='revoke')confirmD('Revoke access to '+sub.name+'?',
   'This removes Blitzy from the server entirely and revokes its permissions at the source. All folder grants and connected projects break. To use it again you must reinstall and re-approve from scratch.',
   'Revoke access',function(){clearTimer(sub.id);cstate[sub.id]='none';render();log(sub.name+' access revoked');},anchor);}

/* ---- folder sharing (top-level folders, push, inheritance) ---- */
/* Folder-first sharing modal (F-009/F-010). Grants are stored per connection as an ARRAY of explicit
   stable-ID tuples {connectionId, folderStableId, folderPathSnapshot, teamId}. Direct and inherited
   views are derived at READ TIME from those tuples — no inherited row is ever persisted. Inheritance
   is anchored on the IMMUTABLE folderStableId, so a folder rename/move is safe (only a hard delete
   breaks a grant). folderPathSnapshot is a human-readable audit trail captured at grant time. */
function shareModal(sub,anchor){var prov=findProv(sub.id),pk=prov?prov.key:'github',folders=FOLDERS[pk]||FOLDERS.github;
 var key=sub.id;var sel='platform',qy='';
 var d=document.getElementById('dialog');
 function byId(id){for(var i=0;i<folders.length;i++){if(folders[i].id===id)return folders[i];}return null;}
 function ancestorsOf(id){var out=[],cur=byId(id),guard=0;while(cur&&cur.parent&&guard++<50){var p=byId(cur.parent);if(!p)break;out.push(p);cur=p;}return out;}
 function pathOf(id){var parts=[],cur=byId(id),guard=0;while(cur&&guard++<50){parts.unshift(cur.n);cur=cur.parent?byId(cur.parent):null;}return parts.join('/');}
 /* Read-time derivations over the tuple store. */
 function directTeams(id){return grants[key].filter(function(t){return t.folderStableId===id;}).map(function(t){return t.teamId;});}
 function inheritedFor(id){var direct=directTeams(id),seen={},res=[];ancestorsOf(id).forEach(function(a){directTeams(a.id).forEach(function(t){if(direct.indexOf(t)<0&&!seen[t]){seen[t]=true;res.push({team:t,from:a.n});}});});return res;}
 function addGrant(fid,team){grants[key].push({connectionId:key,folderStableId:fid,folderPathSnapshot:pathOf(fid),teamId:team});}
 function removeGrant(fid,team){grants[key]=grants[key].filter(function(t){return !(t.folderStableId===fid&&t.teamId===team);});}
 /* Seed once, as explicit tuples. A WORKSPACE-root grant (Frontend Guild on blitzy-ai) inherits down
    to every project; a direct project grant (Galatea UI on platform) demonstrates the direct-vs-
    inherited split and the redundant-grant block when Frontend Guild is searched under platform. */
 if(!grants[key]){grants[key]=[
   {connectionId:key,folderStableId:'ws',folderPathSnapshot:pathOf('ws'),teamId:'Frontend Guild'},
   {connectionId:key,folderStableId:'platform',folderPathSnapshot:pathOf('platform'),teamId:'Galatea UI'}
 ];}
 function paint(){
  var fl=folders.map(function(f){return '<button type="button" class="frow'+(f.parent?' child':'')+(f.id===sel?' sel':'')+'" data-f="'+esc(f.id)+'" aria-current="'+(f.id===sel?'true':'false')+'"><i class="ti ti-folder" aria-hidden="true"></i><span class="fn">'+esc(f.n)+'</span><span class="c">'+directTeams(f.id).length+'</span></button>';}).join('');
  var selF=byId(sel)||{n:sel};var cur=directTeams(sel);var inh=inheritedFor(sel);var inhSet={};inh.forEach(function(x){inhSet[x.team]=x.from;});
  var dHtml=cur.length?cur.map(function(t){return '<div class="acc"><span><i class="ti ti-users uic" aria-hidden="true"></i>'+esc(t)+'</span><button type="button" class="rm" data-rm="'+esc(t)+'">Remove</button></div>';}).join(''):'<div class="muted">No teams added directly.</div>';
  var iHtml=inh.length?'<div class="lbl">Inherited</div>'+inh.map(function(x){return '<div class="acc inh"><span><i class="ti ti-lock lock" aria-hidden="true"></i>'+esc(x.team)+'<span class="src">from '+esc(x.from)+'</span></span></div>';}).join(''):'';
  var ql=qy.toLowerCase();
  var avail=TEAMS.filter(function(t){return cur.indexOf(t)<0&&!inhSet[t]&&t.toLowerCase().indexOf(ql)>=0;});
  var redun=qy.trim()?TEAMS.filter(function(t){return inhSet[t]&&t.toLowerCase().indexOf(ql)>=0;}):[];
  var redHtml=redun.map(function(t){return '<div class="rgrant"><i class="ti ti-info-circle" aria-hidden="true"></i>'+esc(t)+' already inherits access from '+esc(inhSet[t])+'.</div>';}).join('');
  var resHtml=avail.length?avail.map(function(t){return '<button type="button" class="res" data-add="'+esc(t)+'"><span><i class="ti ti-users uic" aria-hidden="true"></i>'+esc(t)+'</span><i class="ti ti-plus addp" aria-hidden="true"></i></button>';}).join(''):(redun.length?'':'<div class="muted">No teams found.</div>');
  d.innerHTML='<div class="dh"><i class="ti '+esc(sub.connect&&sub.connect.form?FORMS[sub.connect.form].mark:(prov?(prov.mark==='az'?'ti-brand-azure':prov.mark):'ti-brand-github'))+'" aria-hidden="true"></i><h3 id="dlgTitle">'+esc(sub.name)+' — folder access</h3></div>'+
   '<p class="dlede">Grant a team access to a top-level folder. Everything inside inherits it. This connection has its own access, separate from other connections.</p>'+
   '<div class="share"><div class="fl">'+fl+'</div><div class="fr"><div class="lbl">Teams with access to '+esc(selF.n)+'</div>'+dHtml+iHtml+
   '<div class="lbl">Add a team</div><input class="q" id="q" placeholder="Search teams" aria-label="Search teams to add" value="'+esc(qy)+'"/>'+redHtml+'<div id="res">'+resHtml+'</div></div></div>'+
   '<div class="drow"><button class="btn primary" id="dno">Done</button></div>';
  d.querySelectorAll('[data-f]').forEach(function(e){e.onclick=function(){sel=this.getAttribute('data-f');qy='';paint();var a=d.querySelector('.frow.sel');if(a)a.focus();};});
  d.querySelectorAll('[data-rm]').forEach(function(e){e.onclick=function(){removeGrant(sel,this.getAttribute('data-rm'));paint();var n=document.getElementById('q');if(n)n.focus();};});
  d.querySelectorAll('[data-add]').forEach(function(e){e.onclick=function(){addGrant(sel,this.getAttribute('data-add'));qy='';paint();var n=document.getElementById('q');if(n)n.focus();};});
  var qi=document.getElementById('q');if(qi)qi.oninput=function(){qy=this.value;paint();var n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(qy.length,qy.length);}};
  document.getElementById('dno').onclick=function(){closeD();log('Updated folder access for '+sub.name);};
 }
 paint();show(anchor);}

function confirmD(t,b,a,yes,anchor){var d=document.getElementById('dialog');
 d.innerHTML='<h3 id="dlgTitle">'+esc(t)+'</h3><p class="dlede" style="margin-top:8px">'+esc(b)+'</p><div class="drow"><button class="btn ghost" id="dno">Cancel</button><button class="btn danger" id="dyes">'+esc(a)+'</button></div>';
 show(anchor);document.getElementById('dno').onclick=closeD;document.getElementById('dyes').onclick=function(){closeD();yes();};}
var lastTrigger=null;
function show(trigger){lastTrigger=(trigger&&trigger.focus)?trigger:document.activeElement;document.getElementById('scrim').classList.add('show');var dlg=document.getElementById('dialog');setTimeout(function(){var f=dlg.querySelector('input:not([disabled]),button:not([disabled]),a[href],select,textarea,[tabindex]:not([tabindex="-1"])');(f||dlg).focus();},0);}
function closeD(){var s=document.getElementById('scrim');if(!s.classList.contains('show'))return;s.classList.remove('show');var t=lastTrigger;lastTrigger=null;if(t&&t.focus&&document.body.contains(t)){try{t.focus();}catch(e){}}}
function scrimOpen(){return document.getElementById('scrim').classList.contains('show');}
function focusables(){var dlg=document.getElementById('dialog');return Array.prototype.slice.call(dlg.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')).filter(function(el){return el.offsetWidth>0||el.offsetHeight>0;});}
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeD();});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(openKebab){closeMenu(true);return;}if(scrimOpen()){closeD();return;}}
 if(e.key==='Tab'&&scrimOpen()){var f=focusables();if(!f.length){e.preventDefault();return;}var first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});

q('[data-scn]').forEach(function(b){b.onclick=function(){q('[data-scn]').forEach(function(x){x.classList.remove('on');});this.classList.add('on');setScenario(this.getAttribute('data-scn'));};});
q('[data-role]').forEach(function(b){b.onclick=function(){q('[data-role]').forEach(function(x){x.classList.remove('on');});this.classList.add('on');role=this.getAttribute('data-role');render();log('Role: '+(role==='admin'?'Super Admin':'Team Member'));};});
/* Category rail clicks are wired inside renderRail() (rail is data-driven and re-rendered). */
renderRail();
setScenario('mixed');
</script>
